<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Телефон: страница по ширине экрана, без масштабирования пальцем, с учётом «челки» (viewport-fit=cover). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Тёмно-коричневый — тон игры (theme.ts, кнопка: 0x241a0b): им красится полоса адреса и рамка вокруг холста. -->
    <meta name="theme-color" content="#241a0b" />
    <meta name="color-scheme" content="dark" />
    <!-- «На главный экран» на iPhone: без адресной строки, тёмная строка состояния под цвет игры. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Долговая яма" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Долговая яма — слот-автомат с долгами: крути, плати, выживай. Игра в браузере, на компьютере и на телефоне." />
    <title>Долговая яма</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Значок вкладки — эмодзи прямо здесь, без файла: иначе браузер ищет /favicon.ico и пишет в консоль ошибку 404.
         PNG рядом — для «на главный экран»: iOS значок из data-URL не берёт. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <main id="app">
      <div id="game"></div>
    </main>
    <!-- «Поверни телефон»: телефон держат стоя — игра 16:9 туда не влезает. Экран поверх всего окна, в стиле игры;
         показывается только на телефоне в портрете (rotateHint.ts), касания до игры не доходят. -->
    <div id="rotate" aria-hidden="true">
      <svg class="rotate-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="22" y="8" width="20" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2.5" />
        <line x1="29" y1="11" x2="35" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="32" cy="37" r="2" fill="currentColor" />
        <path d="M50 26a18 18 0 0 1 0 22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M50 48l4-4m-4 4l-4-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p class="rotate-title">ПОВЕРНИ ТЕЛЕФОН</p>
      <p class="rotate-sub">ROTATE YOUR PHONE</p>
    </div>
    <!-- Яндекс Метрика: сам скрипт грузится всегда, номер счётчика и init — в src/game/metrics.ts. -->
    <script>
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) { return; } }
        k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
